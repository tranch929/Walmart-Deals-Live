<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walmart Deal Finder</title><style>:root{font-family:Arial,sans-serif;color:#15243a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#0876d1;color:#fff;padding:28px 18px}.wrap{max-width:1180px;margin:auto}.panel,.card{background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.panel{margin:20px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:13px;font-weight:bold;display:block;margin-bottom:5px}input,select,button{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:9px;font-size:15px}button{background:#0876d1;color:#fff;border:0;font-weight:bold;cursor:pointer}.secondary{background:#eef5fb;color:#075da5}.searchbox{background:#eef6ff;border-radius:12px;padding:15px;margin:14px 0}.checks{display:flex;gap:18px;margin-top:15px;flex-wrap:wrap}.checks label{font-weight:normal}.checks input{width:auto}.status,.note{padding:12px;border-radius:9px;margin-top:12px}.status{background:#eef6ff}.note{background:#fff8db}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0 40px}.card{padding:15px;display:flex;flex-direction:column}.card img{width:100%;height:190px;object-fit:contain}.price{font-size:25px;font-weight:bold;color:#0876d1}.was{text-decoration:line-through;color:#667085}.save{font-weight:bold;color:#137333}.badge{display:inline-block;background:#fff4d6;border-radius:20px;padding:5px 9px;font-size:12px}.meta{font-size:12px;color:#667085;line-height:1.5}.card a{margin-top:auto;text-decoration:none;background:#0876d1;color:#fff;text-align:center;padding:11px;border-radius:9px;font-weight:bold}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.results{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.grid,.results{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🛒 Walmart Deal Finder</h1><p>Search by department, category, keyword, store, price and discount.</p></div></header><main class="wrap"><section class="panel"><div class="grid"><div><label>ZIP code</label><input id="zip" maxlength="5" placeholder="63366"></div><div><label>Walmart store</label><select id="store"><option value="">Nationwide / Walmart.com</option><option value="2616">#2616 O'Fallon</option><option value="5313">#5313 Lake Saint Louis</option><option value="5427">#5427 St. Peters — Mid Rivers</option><option value="648">#648 St. Peters — Jungermann</option><option value="1161">#1161 St. Charles</option><option value="243">#243 Wentzville</option><option value="2600">#2600 Chesterfield</option><option value="custom">Other store number…</option></select></div></div><div class="searchbox"><div class="grid"><div><label>1. Department</label><select id="department"></select></div><div><label>2. Category</label><select id="category"><option value="">All Categories</option></select></div><div><label>3. Keyword Search</label><input id="keyword" placeholder="Barbie, LEGO, beads, detergent…"></div><div><label>Sort</label><select id="sort"><option value="price_low">Lowest price first</option><option value="price_high">Highest price first</option><option value="best_seller">Best seller</option><option value="rating_high">Highest rated</option><option value="best_match">Best match</option><option value="new">Newest</option></select></div></div></div><div class="grid"><div><label>Minimum price</label><input id="min" type="number" value="0" min="0"></div><div><label>Maximum price</label><input id="max" type="number" value="25" min="0"></div><div><label>Minimum discount %</label><input id="discount" type="number" value="0" min="0" max="100"></div><div><label>Pages to check</label><select id="pages"><option selected>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><small>1 page = about 1 SerpApi search</small></div></div><div class="checks"><label><input id="walmartOnly" type="checkbox" checked> Walmart seller only</label><label><input id="hideOut" type="checkbox"> Hide out-of-stock</label></div><div class="note">Store prices and inventory can change quickly. Always use <b>Verify at Walmart</b> before driving to a store.</div><div style="display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:14px"><button id="search">Search Walmart</button><button id="clear" class="secondary">Reset</button></div><div id="status" class="status">Ready. Choose any department, category or keyword.</div></section><section id="results" class="results"></section></main><script>const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('en-US',{style:'currency',currency:'USD'});let customStore='';const D={"All Departments":[],"Toys":["Action Figures","Arts & Crafts","Building Sets & Blocks","Dolls & Dollhouses","Games & Puzzles","Learning Toys","Outdoor Toys","Ride-On Toys","Stuffed Animals"],"Home":["Bedding","Bath","Furniture","Home Decor","Kitchen & Dining","Storage & Organization","Rugs","Lighting"],"Electronics":["TVs","Computers","Tablets","Cell Phones","Headphones","Video Games","Smart Home","Cameras"],"Clothing":["Women's Clothing","Men's Clothing","Girls' Clothing","Boys' Clothing","Baby Clothing","Shoes","Socks","Accessories"],"Baby":["Baby Gear","Car Seats","Diapers","Feeding","Nursery","Baby Toys"],"Beauty":["Hair Care","Skin Care","Makeup","Fragrance","Nail Care","Bath & Body"],"Grocery":["Snacks","Beverages","Pantry","Breakfast","Candy","Frozen Food"],"Sports & Outdoors":["Exercise & Fitness","Outdoor Recreation","Sports Equipment","Camping","Bikes"],"Auto":["Auto Parts","Car Care","Tires","Auto Electronics","Interior Accessories"],"Arts & Crafts":["Beads & Jewelry Making","Cricut & Cutting Machines","Sewing","Yarn","Painting","Craft Supplies"],"Pets":["Dog Supplies","Cat Supplies","Pet Food","Pet Toys"],"Health":["Vitamins","Personal Care","First Aid","Wellness"],"Patio & Garden":["Patio Furniture","Grills","Garden Center","Outdoor Decor"],"Household Essentials":["Laundry","Cleaning Supplies","Paper Products","Storage Bags"]};Object.keys(D).forEach(x=>$('department').add(new Option(x,x==='All Departments'?'':x)));function cats(){let d=$('department').value;$('category').innerHTML='<option value="">All Categories</option>';(D[d]||[]).forEach(x=>$('category').add(new Option(x,x)))}$('department').onchange=cats;$('store').onchange=()=>{if($('store').value==='custom')customStore=prompt('Enter Walmart store number:','')||''};function store(){return $('store').value==='custom'?customStore:$('store').value}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function search(){let b=$('search');b.disabled=true;b.textContent='Searching…';$('results').innerHTML='';let q=[$('department').value,$('category').value,$('keyword').value].filter(Boolean).join(' ')||'clearance';$('status').textContent='Checking live Walmart results…';let p=new URLSearchParams({q,store:store(),min:$('min').value||0,max:$('max').value||10000,discount:$('discount').value||0,pages:$('pages').value,sort:$('sort').value,walmartOnly:$('walmartOnly').checked});try{let r=await fetch('/api/deals?'+p),d=await r.json();if(!r.ok)throw Error(d.error||'Search failed');let items=d.items||[];if($('hideOut').checked)items=items.filter(x=>x.stock!=='Out of stock');$('status').innerHTML=`Found <b>${items.length}</b> matching items. Checked ${esc(new Date(d.checkedAt).toLocaleString())}.`; $('results').innerHTML=items.length?items.map(x=>`<article class="card">${x.image?`<img src="${esc(x.image)}">`:''}<h3>${esc(x.title)}</h3><div><span class="price">${money(x.price)}</span> ${x.wasPrice?`<span class="was">${money(x.wasPrice)}</span>`:''}</div>${x.savings>0?`<div class="save">Save ${money(x.savings)} · ${x.discountPct}% off</div>`:''}<p><span class="badge">${esc(x.stock)}</span></p><p class="meta">${x.seller?`Seller: ${esc(x.seller)}<br>`:''}${x.upc?`UPC: ${esc(x.upc)}<br>`:''}${store()?`Store #${esc(store())}<br>`:''}Checked: ${esc(new Date(x.checkedAt).toLocaleString())}</p><a href="${esc(x.url)}" target="_blank" rel="noopener">Verify at Walmart ↗</a></article>`).join(''):'<div class="panel" style="grid-column:1/-1">No items matched. Try a broader category, higher maximum price, or lower discount.</div>'}catch(e){$('status').innerHTML='<b>Search error:</b> '+esc(e.message)}finally{b.disabled=false;b.textContent='Search Walmart'}}$('search').onclick=search;$('clear').onclick=()=>location.reload();</script></body></html>
